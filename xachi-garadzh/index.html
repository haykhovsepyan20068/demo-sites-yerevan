<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Boom Party — Yerevan</title>
  <meta name="description" content="Boom Party, Yerevan: party goods, toys, books and gifts.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&family=Noto+Sans+Armenian:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header" id="header">
  <div class="wrap header__in">
    <a class="logo" href="#top" id="logo"></a>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="header__tools">
      <div class="lang" id="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="hy">ՀԱՅ</button>
      </div>
      <a class="btn btn--call header__call" id="headCall"></a>
      <button class="burger" id="burger" type="button" aria-label="Menu" aria-expanded="false"><span></span></button>
    </div>
  </div>
</header>

<main id="top">
  <section class="hero" id="hero">
    <i class="confetti" aria-hidden="true"></i>
    <div class="wrap hero__in">
      <div class="hero__text">
        <p class="eyebrow" id="heroEyebrow"></p>
        <h1 id="heroTitle"></h1>
        <p class="lead" id="heroText"></p>
        <div class="hero__cta">
          <a class="btn btn--call" id="heroCall"></a>
          <a class="btn btn--ghost" id="heroMap" target="_blank" rel="noopener"></a>
        </div>
        <ul class="chips" id="heroChips"></ul>
      </div>
      <div class="hero__art" aria-hidden="true">
        <svg viewBox="0 0 420 460" role="img">
          <defs>
            <radialGradient id="gP" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ff8db4"/><stop offset="1" stop-color="var(--primary)"/></radialGradient>
            <radialGradient id="gY" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffe38a"/><stop offset="1" stop-color="var(--accent)"/></radialGradient>
            <radialGradient id="gT" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#7cece1"/><stop offset="1" stop-color="var(--alt)"/></radialGradient>
          </defs>
          <circle cx="215" cy="240" r="190" fill="var(--soft)"/>
          <g class="float f1"><path d="M105 330 C110 370 95 395 110 430" stroke="var(--ink)" stroke-width="2" fill="none" opacity=".35"/><ellipse cx="105" cy="250" rx="62" ry="78" fill="url(#gP)"/><ellipse cx="85" cy="222" rx="12" ry="20" fill="#fff" opacity=".45" transform="rotate(20 85 222)"/><path d="M99 326 l6 12 l6 -12z" fill="var(--primary)"/></g>
          <g class="float f2"><path d="M222 300 C214 350 236 380 218 435" stroke="var(--ink)" stroke-width="2" fill="none" opacity=".35"/><ellipse cx="222" cy="205" rx="70" ry="88" fill="url(#gY)"/><ellipse cx="200" cy="172" rx="13" ry="22" fill="#fff" opacity=".5" transform="rotate(20 200 172)"/><path d="M216 291 l6 13 l6 -13z" fill="var(--accent)"/></g>
          <g class="float f3"><path d="M333 318 C340 360 322 390 336 432" stroke="var(--ink)" stroke-width="2" fill="none" opacity=".35"/><ellipse cx="333" cy="245" rx="58" ry="72" fill="url(#gT)"/><ellipse cx="315" cy="220" rx="11" ry="18" fill="#fff" opacity=".45" transform="rotate(20 315 220)"/><path d="M327 316 l6 11 l6 -11z" fill="var(--alt)"/></g>
          <g class="bob"><rect x="150" y="372" width="120" height="78" rx="10" fill="var(--ink)"/><rect x="150" y="372" width="120" height="22" rx="8" fill="var(--primary)"/><rect x="199" y="372" width="22" height="78" fill="var(--accent)"/><path d="M210 372 C190 340 165 352 182 372 M210 372 C230 340 255 352 238 372" stroke="var(--accent)" stroke-width="9" fill="none" stroke-linecap="round"/></g>
          <g fill="var(--accent)"><path d="M60 110 l7 16 l17 3 l-13 11 l4 17 l-15 -9 l-15 9 l4 -17 l-13 -11 l17 -3z"/><path d="M355 80 l5 11 l12 2 l-9 8 l3 12 l-11 -6 l-11 6 l3 -12 l-9 -8 l12 -2z" fill="var(--primary)"/></g>
        </svg>
        <div class="stamp" id="stamp"></div>
      </div>
    </div>
    <svg class="wave" viewBox="0 0 1440 80" preserveAspectRatio="none" aria-hidden="true"><path d="M0 40 C240 90 480 0 720 40 C960 80 1200 0 1440 40 L1440 80 L0 80Z" fill="var(--bg)"/></svg>
  </section>

  <section class="sec" id="about">
    <div class="wrap about">
      <div>
        <p class="eyebrow" data-i18n="nav_about"></p>
        <h2 id="aboutTitle"></h2>
      </div>
      <p class="about__text" id="aboutText"></p>
    </div>
  </section>

  <section class="sec sec--tint" id="products">
    <div class="wrap">
      <p class="eyebrow" data-i18n="nav_products"></p>
      <h2 data-i18n="products_title"></h2>
      <ul class="grid" id="productGrid"></ul>
    </div>
  </section>

  <section class="sec" id="delivery">
    <div class="wrap">
      <div class="deliv" id="deliveryBox"></div>
    </div>
  </section>

  <section class="sec sec--dark" id="contacts">
    <div class="wrap">
      <p class="eyebrow eyebrow--light" data-i18n="nav_contacts"></p>
      <h2 data-i18n="contacts_title"></h2>
      <div class="contact">
        <ul class="contact__list" id="contactList"></ul>
        <div class="hours" id="hoursBox"></div>
      </div>
      <ul class="social" id="socialList"></ul>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="wrap footer__in">
    <span id="footName"></span>
  </div>
  <div class="wrap"><p class="demo" id="footDemo"></p></div>
</footer>

<a class="fab" id="fab" aria-label="Call"></a>

<noscript><p style="padding:16px">Please enable JavaScript to view this page.</p></noscript>

<script src="js/content.js"></script>
<script src="js/app.js"></script>
</body>
</html>
